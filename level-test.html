main{padding:40px 0 80px}

.facts div{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.facts b{display:block;font:800 22px var(--display)}

.note{background:var(--lav);color:var(--lav-ink);border-radius:14px;padding:12px 16px;font-size:15px;margin-top:18px}

.lvtag{background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px}
.prog{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:20px}

.q{padding:28px 26px}
.kind{display:inline-block;font:700 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}

.passage{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:17px;line-height:1.6}
.stem{font:700 21px/1.45 var(--body);margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:600 17px var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--ink)}
.opt b{width:30px;height:30px;flex:none;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:var(--ink);background:var(--lime-soft)}
.opt.sel b{background:var(--lime);color:#16171a}
.play{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.play .btn{font-size:16px}
.play small{color:var(--muted)}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}

.res{padding:34px 30px;text-align:center}
.big{font:800 96px/1 var(--display);margin:6px 0 4px}
.big.lv{display:inline-block;background:var(--lime);color:#16171a;border-radius:28px;padding:10px 34px}
.res h2{font-size:28px;margin-top:16px}
.res .d{color:var(--muted);margin-top:10px;font-size:17px}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0 6px;text-align:left}
.skills div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.skills b{display:block;font:800 20px var(--display)}
.skills span{color:var(--muted);font-size:14px}

.ladder span{font:800 15px var(--display);padding:8px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.ladder span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{text-align:left;margin-top:22px;padding:20px 22px}
.box h3{font-size:20px;margin-bottom:10px}
.box ul{padding-left:20px}
.box li{margin:6px 0}
.cloud{margin-top:18px;padding:14px 16px;border-radius:14px;border:1.5px dashed var(--line);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:600}
.cloud.ok{border-style:solid;border-color:#9fbf1f;background:var(--lime-soft)}
.ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
@media(max-width:600px){.facts{grid-template-columns:1fr}.skills{grid-template-columns:repeat(2,1fr)}.q,.intro,.res{padding:24px 18px}.stem{font-size:19px}.big{font-size:72px}}

var INFO={
 "Pre-A1":{n:"শুরুর ধাপ",d:"আপনি একদম শুরু থেকে শিখছেন। এটা কোনো সমস্যা না, সবাই কোথাও না কোথাও থেকে শুরু করে।",can:["খুব সাধারণ শব্দ আর বাক্য চিনতে পারেন"],next:["প্রতিদিন ১০–১৫টা নতুন শব্দ শিখুন (ছবিসহ)","am / is / are আর সাধারণ present tense দিয়ে শুরু করুন","ধীরে বলা ছোট ইংরেজি ভিডিও শুনুন"]},
 A1:{n:"Beginner",d:"নিজের পরিচয় দেওয়া আর খুব সাধারণ প্রশ্নের উত্তর দিতে পারেন।",can:["নিজের নাম, বয়স, কোথায় থাকেন বলতে পারেন","সহজ নোট আর সাইন বুঝতে পারেন"],next:["past tense (went, saw, did) আর প্রশ্ন করা শিখুন","দৈনন্দিন কাজের শব্দ (খাবার, বাজার, যাতায়াত) বাড়ান","প্রতিদিন ৫টা সহজ বাক্য জোরে বলুন"]},

var KEY="ac-level";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var out=document.getElementById("out");
var S; // state

function intro(){
  var p=load(),prev="";
  if(p){var days=Math.floor((Date.now()-p.at)/864e5);
    prev='<div class="prev bn">আগের ফলাফল: <b>'+esc(p.level)+'</b> ('+(days?bn(days)+' দিন আগে':'আজ')+')'+(days<28?' · ৪ সপ্তাহ পর আবার দিলে উন্নতি ভালো বোঝা যাবে।':' · এখন আবার দিয়ে দেখুন কতটা উন্নতি হলো!')+'</div>';}

   '<div class="facts bn"><div><b>৮–১৫ মিনিট</b><span>সময় লাগবে</span></div><div><b>A1 → C1+</b><span>CEFR লেভেল</span></div><div><b>লগইন লাগবে না</b><span>একদম ফ্রি</span></div></div>'+
   '<div class="note bn">🎧 Listening প্রশ্নের জন্য সাউন্ড চালু রাখুন। কোনো প্রশ্ন না জানলে আন্দাজ না করে “জানি না” চাপুন, তাহলে ফলাফল বেশি সঠিক হবে।</div>'+prev+
   '<div class="ctas"><button class="btn pri" id="go" style="font-size:17px;padding:14px 24px">টেস্ট শুরু করুন →</button></div></div>';
  document.getElementById("go").onclick=start;
}

function start(){
  S={li:0,qi:0,ans:{},per:{},plays:{},sk:{g:[0,0],v:[0,0],r:[0,0],l:[0,0]},passed:-1,order:{}};
  LV.forEach(function(l){S.order[l]=Q[l].map(function(q){return shuffle(q.o.map(function(t,i){return{t:t,ok:i===q.a}})).concat([{t:"জানি না",ok:false,dk:true}])})});
  show();
}

function speak(text){
  if(!("speechSynthesis" in window))return false;
  speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.92;
  var vs=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)/i.test(v.lang)});
  var pick=vs.find(function(v){return /en-US/i.test(v.lang)&&/Google|Samantha|Natural|Aria|Jenny/i.test(v.name)})||vs.find(function(v){return /en-US/i.test(v.lang)})||vs[0];
  if(pick)u.voice=pick;speechSynthesis.speak(u);return true;
}

function show(){
  var lv=LV[S.li],q=Q[lv][S.qi],opts=S.order[lv][S.qi],key=lv+S.qi,sel=S.ans[key];
  var done=S.li*6+S.qi,total=30;
  var h='<div class="top"><span class="bn">প্রশ্ন '+bn(S.qi+1)+'/৬</span><span class="lvtag">Level '+lv+'</span></div>'+
    '<div class="prog"><i style="width:'+(done/total*100)+'%"></i></div><div class="card q"><span class="kind">'+KIND[q.k]+'</span>';
  if(q.k==="g"||q.k==="v")h+='<div class="inst bn">খালি জায়গার জন্য সঠিক উত্তর বেছে নিন</div>';
  if(q.k==="r")h+='<div class="inst bn">লেখাটা পড়ে প্রশ্নের উত্তর দিন</div><div class="passage">'+esc(q.p)+'</div>';
  if(q.k==="l"){var left=2-(S.plays[key]||0);
    h+='<div class="inst bn">অডিওটা শুনে প্রশ্নের উত্তর দিন (সর্বোচ্চ ২ বার)</div><div class="play"><button class="btn lime" id="pl"'+(left<=0?' disabled':'')+'>▶ শুনুন</button><small class="bn">'+left+' বার বাকি</small></div><div id="nosp"></div>';}
  h+='<div class="stem">'+esc(q.s)+'</div><div class="opts">';
  opts.forEach(function(o,i){h+='<button class="opt'+(sel===i?' sel':'')+(o.dk?' bn':'')+'" data-i="'+i+'"><b>'+(o.dk?'?':String.fromCharCode(65+i))+'</b>'+esc(o.t)+'</button>'});
  h+='</div><div class="nav2"><span></span><button class="btn pri bn" id="nx"'+(sel===undefined?' disabled':'')+'>'+(S.qi===5?'জমা দিন →':'পরের প্রশ্ন →')+'</button></div></div>';
  out.innerHTML=h;window.scrollTo(0,0);
  out.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){S.ans[key]=+b.dataset.i;show()}});
  document.getElementById("nx").onclick=next;
  var pl=document.getElementById("pl");
  if(pl)pl.onclick=function(){if(!speak(q.t)){document.getElementById("nosp").innerHTML='<div class="passage"><span class="bn" style="color:var(--muted)">এই ব্রাউজারে অডিও চলছে না, তাই লেখাটা দেখানো হলো:</span><br>'+esc(q.t)+'</div>';}
    S.plays[key]=(S.plays[key]||0)+1;var left=2-S.plays[key];pl.nextElementSibling.textContent=bn(left)+' বার বাকি';if(left<=0)pl.disabled=true;};
}

function next(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  if(S.qi<5){S.qi++;show();return}
  var lv=LV[S.li],c=0;
  for(var i=0;i<6;i++){var o=S.order[lv][i][S.ans[lv+i]],k=Q[lv][i].k;S.sk[k][1]++;if(o&&o.ok){c++;S.sk[k][0]++}}
  S.per[lv]=c;
  if(c>=4){S.passed=S.li;if(S.li<LV.length-1){S.li++;S.qi=0;show();return}}
  result();
}

function result(){
  var lvl=S.passed<0?"Pre-A1":LV[S.passed];
  if(lvl==="C1"&&S.per.C1===6)lvl="C1+";
  var inf=INFO[lvl];
  var rec={level:lvl,at:Date.now(),per:S.per};save(rec);
  var ladder=["A1","A2","B1","B2","C1","C2"].map(function(l){var on=(lvl===l)||(lvl==="C1+"&&l==="C1");return '<span class="'+(on?'on':'')+'">'+l+'</span>'}).join("");
  var sk=Object.keys(S.sk).map(function(k){var v=S.sk[k];return '<div><b>'+v[0]+'/'+v[1]+'</b><span>'+KIND[k]+'</span></div>'}).join("");
  var h='<div class="card res"><span class="kind bn">আপনার আনুমানিক লেভেল</span><div><span class="big lv">'+(lvl==="Pre-A1"?"A0":lvl)+'</span></div>'+
   '<h2>'+esc(inf.n)+'</h2><p class="d bn">'+inf.d+'</p><div class="ladder">'+ladder+'</div>'+
   '<div class="skills">'+sk+'</div>'+
   '<div class="card box bn"><h3>✅ এখন আপনি যা পারেন</h3><ul>'+inf.can.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div>'+
   '<div class="card box bn"><h3>🎯 পরের ধাপে যা করবেন</h3><ul>'+inf.next.map(function(x){return '<li>'+x+'</li>'}).join("")+
   '<li>উচ্চারণের জন্য আমাদের ফ্রি দৈনিক প্ল্যান ব্যবহার করুন</li></ul></div>'+
   '<div class="note bn" style="text-align:left">📅 প্রতিদিন নিয়মিত প্র্যাকটিস করে ৪ সপ্তাহ পর আবার টেস্ট দিন, তাহলে নিজের উন্নতি নিজেই দেখতে পাবেন।<br>ℹ️ এটা একটা আনুমানিক টেস্ট, অফিসিয়াল সার্টিফিকেট না। Speaking আর writing এখানে মাপা হয়নি।</div>'+
   '<div id="cloudbox" class="bn"></div><div class="ctas bn"><a class="btn pri" href="app.html">উচ্চারণ প্র্যাকটিস শুরু করুন →</a><button class="btn" id="again">আবার টেস্ট দিন</button><button class="btn" id="share">🔗 শেয়ার করুন</button></div></div>';
  out.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("again").onclick=start;
  if(window.acLevelResult)window.acLevelResult(rec);else window.acPending=rec;
  document.getElementById("share").onclick=function(){var t="আমার ইংরেজি লেভেল "+(lvl==="Pre-A1"?"A0":lvl)+"! আপনিও ফ্রিতে টেস্ট দিন:",u="https://accent-coach.devmamun.com/level-test.html";
    if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});
    else{try{navigator.clipboard.writeText(t+" "+u);this.textContent="✓ লিংক কপি হয়েছে"}catch(e){}}};
}

window.acIntro=function(){if(document.getElementById("go"))intro()};
intro();
})();
</script>
<script type="module">
import * as C from "./cloud.js?v=15";
let user=null,pending=window.acPending||null,state="";
const box=()=>{const el=document.getElementById("cloudbox");if(!el||!pending)return;
  if(state==="ok")el.innerHTML='<div class="cloud ok">☁️ ফলাফল আপনার অ্যাকাউন্টে সেভ হয়েছে। যেকোনো ডিভাইস থেকে দেখতে পাবেন।</div>';
  else if(state==="saving")el.innerHTML='<div class="cloud">☁️ সেভ হচ্ছে…</div>';
  else if(state==="err")el.innerHTML='<div class="cloud">⚠️ ক্লাউডে সেভ হয়নি (ফলাফল এই ডিভাইসে আছে)। <button class="btn" id="cs">আবার চেষ্টা করুন</button></div>';
  else if(!user)el.innerHTML='<div class="cloud">☁️ ফলাফল অ্যাকাউন্টে সেভ করে রাখতে চান? <button class="btn" id="cs">Google দিয়ে লগইন করুন</button></div>';
  const b=document.getElementById("cs");if(b)b.onclick=()=>{if(user)doSave();else C.signIn().catch(()=>{})};};
async function doSave(){if(!user||!pending)return;state="saving";box();
  try{await C.saveLevel(user,pending);state="ok"}catch(e){console.warn(e);state="err"}box();}
window.acLevelResult=r=>{pending=r;state="";if(user)doSave();else box();};
if(C.enabled)C.onUser(async u=>{if(u&&u.cached)return;user=u||null;
  if(user&&pending&&state!=="ok"){doSave();return}
  box();
  if(user&&!pending){try{const c=await C.lastLevel(user);let l=null;try{l=JSON.parse(localStorage.getItem("ac-level")||"null")}catch(e){}
    if(c&&(!l||c.at>l.at)){try{localStorage.setItem("ac-level",JSON.stringify(c))}catch(e){}window.acIntro&&window.acIntro()}}catch(e){console.warn(e)}}});
</script>
