<script>
(function(){
var LV=["A1","A2","B1","B2","C1"];
var KIND={g:"Grammar",v:"Vocabulary",r:"Reading",l:"Listening"};
// Each level: 6 questions. a = index of the correct option (options are shuffled on screen).
var Q={
A1:[
 {k:"g",s:"She ___ a teacher.",o:["is","am","are","be"],a:0},
 {k:"g",s:"I ___ like coffee.",o:["don't","doesn't","not","no"],a:0},
 {k:"v",s:"The opposite of “hot” is ___.",o:["cold","big","fast","tall"],a:0},
 {k:"g",s:"There ___ two books on the table.",o:["are","is","be","am"],a:0},
 {k:"r",p:"Hi Sara, I am at the shop. I will be home at 6 o'clock. – Mum",s:"When will Mum be home?",o:["At 6 o'clock","Now","At 9 o'clock","She is at home"],a:0},
 {k:"l",t:"My name is Rahim. I am twenty years old, and I live in Dhaka.",s:"How old is Rahim?",o:["20","12","22","30"],a:0}
],
A2:[
 {k:"g",s:"Yesterday we ___ to the park.",o:["went","go","gone","going"],a:0},
 {k:"g",s:"This bag is ___ than that one.",o:["cheaper","more cheap","cheapest","cheap"],a:0},
 {k:"v",s:"I ___ my homework every evening.",o:["do","make","take","play"],a:0},
 {k:"g",s:"Look! It ___ outside.",o:["is raining","rains","rained","rain"],a:0},
 {k:"r",p:"The library opens at 9 a.m. from Monday to Friday. On Saturday it opens at 11 a.m. It is closed on Sunday.",s:"When does the library open on Saturday?",o:["At 11 a.m.","At 9 a.m.","It doesn't open","On Sunday"],a:0},
 {k:"l",t:"The train to Chittagong leaves at a quarter past four from platform three.",s:"What time does the train leave?",o:["4:15","4:45","3:15","4:30"],a:0}
],
B1:[
 {k:"g",s:"If it rains tomorrow, we ___ at home.",o:["will stay","would stay","stayed","stay"],a:0},
 {k:"g",s:"I have lived here ___ 2019.",o:["since","for","from","at"],a:0},
 {k:"v",s:"Could you ___ the music down? I'm trying to sleep.",o:["turn","put","take","get"],a:0},
 {k:"g",s:"The report ___ by the manager yesterday.",o:["was written","wrote","has written","is writing"],a:0},
 {k:"r",p:"Although the hotel was expensive, we decided to stay there because it was close to the beach and the reviews were excellent.",s:"Why did they choose the hotel?",o:["Its location and good reviews","It was cheap","There was no other hotel","A friend worked there"],a:0},
 {k:"l",t:"Sorry, I can't make it to the meeting on Tuesday. Could we move it to Thursday afternoon instead?",s:"What does the speaker want?",o:["To move the meeting to Thursday afternoon","To cancel the meeting","To meet on Tuesday morning","To join the meeting late"],a:0}
],
B2:[
 {k:"g",s:"If I ___ about the traffic, I would have left earlier.",o:["had known","knew","have known","would know"],a:0},
 {k:"g",s:"She suggested ___ a taxi to the airport.",o:["taking","to take","take","took"],a:0},
 {k:"v",s:"The company decided to ___ the launch until next spring.",o:["put off","put up","put out","put on"],a:0},
 {k:"v",s:"His argument was very ___; everyone in the room agreed with him.",o:["convincing","convinced","convince","conviction"],a:0},
 {k:"r",p:"Remote work has given many employees more flexibility, but some managers worry that it makes collaboration harder and that new staff feel less connected to the team.",s:"What are the managers worried about?",o:["Weaker teamwork and connection","Higher office costs","Lower salaries","Employees wanting to return"],a:0},
 {k:"l",t:"Contrary to what most people assume, the study found that short breaks every hour actually improved productivity rather than reducing it.",s:"What did the study find?",o:["Short breaks improved productivity","Breaks reduced productivity","Breaks had no effect","People should work longer hours"],a:0}
],
C1:[
 {k:"g",s:"Not only ___ late, but he also forgot the documents.",o:["did he arrive","he arrived","he did arrive","arrived he"],a:0},
 {k:"g",s:"___ the bad weather, the event went ahead as planned.",o:["Despite","Although","However","Even"],a:0},
 {k:"v",s:"The minister's speech was deliberately ___, leaving journalists unsure of her real position.",o:["ambiguous","explicit","concise","blunt"],a:0},
 {k:"v",s:"The new findings ___ doubt on the earlier theory.",o:["cast","threw","made","put"],a:0},
 {k:"r",p:"While the initiative was hailed as a breakthrough, critics pointed out that its long-term viability hinged on funding that had yet to be secured.",s:"What is the critics' main point?",o:["Its future depends on money not yet guaranteed","It has already failed","It is fully funded","It was too expensive to start"],a:0},
 {k:"l",t:"I wouldn't go so far as to say the proposal is flawed, but it does leave a number of questions unanswered.",s:"What is the speaker's opinion of the proposal?",o:["It is reasonable but incomplete","It is completely flawed","It is excellent","They haven't read it"],a:0}
]};

var INFO={
 "Pre-A1":{n:"Starter",d:"You are starting from the very beginning. That's completely fine: everyone starts somewhere.",can:["Recognise very common words and short phrases"],next:["Learn 10–15 new words every day","Start with am / is / are and the simple present","Listen to short, slow English videos"]},
 A1:{n:"Beginner",d:"You can introduce yourself and answer very simple questions.",can:["Say your name, age and where you live","Understand simple notes and signs"],next:["Learn the past tense (went, saw, did) and how to ask questions","Build everyday vocabulary: food, shopping, travel","Say 5 simple sentences out loud every day"]},
 A2:{n:"Elementary",d:"You can talk about simple everyday topics and understand short texts.",can:["Talk simply about shopping, time and directions","Understand short notices and messages"],next:["Learn the future (will / going to) and the present perfect","Practise describing your day in 5–6 sentences","Listen to slow English podcasts"]},
 B1:{n:"Intermediate",d:"You can give your opinion on familiar topics and keep a simple conversation going.",can:["Talk about work, study and travel","Understand the main points of everyday emails and articles"],next:["Strengthen conditionals, the passive and phrasal verbs","Try speaking about a topic for 1–2 minutes without stopping","Watch videos with English subtitles"]},
 B2:{n:"Upper-Intermediate",d:"You can speak confidently in most situations and understand detailed texts.",can:["Handle job interviews and client calls","Understand the news and formal writing"],next:["Focus on pronunciation and fluency","Learn advanced vocabulary and collocations","Listen to videos and podcasts without subtitles"]},
 C1:{n:"Advanced",d:"You can speak fluently about complex topics and understand subtle meaning.",can:["Lead professional meetings and presentations","Understand long, complex texts"],next:["Polish your pronunciation and natural rhythm","Grow the vocabulary of your own field","Work on the style and tone of your writing"]},
 "C1+":{n:"Advanced+",d:"You answered every question at the highest level of this test. To confirm C2, an official exam (such as IELTS or Cambridge) is the best option.",can:["Fluent English in almost every situation"],next:["Polish your pronunciation and accent","Prepare for an official exam if you need a certificate"]}
};

var KEY="ac-level";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function bn(n){return String(n)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var out=document.getElementById("out");
var S; // state

function intro(){
  var p=load(),prev="";
  if(p){var days=Math.floor((Date.now()-p.at)/864e5);
    prev='<div class="prev">Your last result: <b>'+esc(p.level)+'</b> ('+(days?days+(days===1?' day ago':' days ago'):'today')+')'+(days<28?' · Retake it after 4 weeks of practice to see real progress.':' · Take it again now and see how much you have improved!')+'</div>';}
  out.innerHTML='<div class="card intro"><span class="kind">Free English level test</span>'+
   '<h1>Find your <mark>English level</mark></h1>'+
   '<p>A short test of grammar, vocabulary, reading and listening. Questions go from easy to hard, and the test ends as soon as your level is clear.</p>'+
   '<div class="facts"><div><b>8–15 minutes</b><span>to finish</span></div><div><b>A1 → C1+</b><span>CEFR levels</span></div><div><b>No login needed</b><span>completely free</span></div></div>'+
   '<div class="note">🎧 Turn your sound on for the listening questions. If you don\'t know an answer, tap “I don\'t know” instead of guessing. Your result will be more accurate.</div>'+prev+
   '<div class="ctas"><button class="btn pri" id="go" style="font-size:17px;padding:14px 24px">Start the test →</button></div></div>';
  document.getElementById("go").onclick=start;
}

function start(){
  S={li:0,qi:0,ans:{},per:{},plays:{},sk:{g:[0,0],v:[0,0],r:[0,0],l:[0,0]},passed:-1,order:{}};
  LV.forEach(function(l){S.order[l]=Q[l].map(function(q){return shuffle(q.o.map(function(t,i){return{t:t,ok:i===q.a}})).concat([{t:"I don't know",ok:false,dk:true}])})});
  show();
}

function speak(text){
  if(!("speechSynthesis" in window))return false;
  speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.92;
  var vs=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)/i.test(v.lang)});
  var pick=vs.find(function(v){return /en-US/i.test(v.lang)&&/Google|Samantha|Natural|Aria|Jenny/i.test(v.name)})||vs.find(function(v){return /en-US/i.test(v.lang)})||vs[0];
  if(pick)u.voice=pick;speechSynthesis.speak(u);return true;
}

function show(){
  var lv=LV[S.li],q=Q[lv][S.qi],opts=S.order[lv][S.qi],key=lv+S.qi,sel=S.ans[key];
  var done=S.li*6+S.qi,total=30;
  var h='<div class="top"><span>Question '+(S.qi+1)+' of 6</span><span class="lvtag">Level '+lv+'</span></div>'+
    '<div class="prog"><i style="width:'+(done/total*100)+'%"></i></div><div class="card q"><span class="kind">'+KIND[q.k]+'</span>';
  if(q.k==="g"||q.k==="v")h+='<div class="inst">Choose the right answer for the gap</div>';
  if(q.k==="r")h+='<div class="inst">Read the text and answer the question</div><div class="passage">'+esc(q.p)+'</div>';
  if(q.k==="l"){var left=2-(S.plays[key]||0);
    h+='<div class="inst">Listen and answer the question (you can play it twice)</div><div class="play"><button class="btn lime" id="pl"'+(left<=0?' disabled':'')+'>▶ Play</button><small>'+left+' plays left</small></div><div id="nosp"></div>';}
  h+='<div class="stem">'+esc(q.s)+'</div><div class="opts">';
  opts.forEach(function(o,i){h+='<button class="opt'+(sel===i?' sel':'')+(o.dk?' bn':'')+'" data-i="'+i+'"><b>'+(o.dk?'?':String.fromCharCode(65+i))+'</b>'+esc(o.t)+'</button>'});
  h+='</div><div class="nav2"><span></span><button class="btn pri bn" id="nx"'+(sel===undefined?' disabled':'')+'>'+(S.qi===5?'Submit →':'Next question →')+'</button></div></div>';
  out.innerHTML=h;window.scrollTo(0,0);
  out.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){S.ans[key]=+b.dataset.i;show()}});
  document.getElementById("nx").onclick=next;
  var pl=document.getElementById("pl");
  if(pl)pl.onclick=function(){if(!speak(q.t)){document.getElementById("nosp").innerHTML='<div class="passage"><span style="color:var(--muted)">Audio doesn\'t play in this browser, so here is the text:</span><br>'+esc(q.t)+'</div>';}
    S.plays[key]=(S.plays[key]||0)+1;var left=2-S.plays[key];pl.nextElementSibling.textContent=left+' plays left';if(left<=0)pl.disabled=true;};
}

function next(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  if(S.qi<5){S.qi++;show();return}
  var lv=LV[S.li],c=0;
  for(var i=0;i<6;i++){var o=S.order[lv][i][S.ans[lv+i]],k=Q[lv][i].k;S.sk[k][1]++;if(o&&o.ok){c++;S.sk[k][0]++}}
  S.per[lv]=c;
  if(c>=4){S.passed=S.li;if(S.li<LV.length-1){S.li++;S.qi=0;show();return}}
  result();
}

function result(){
  var lvl=S.passed<0?"Pre-A1":LV[S.passed];
  if(lvl==="C1"&&S.per.C1===6)lvl="C1+";
  var inf=INFO[lvl];
  var rec={level:lvl,at:Date.now(),per:S.per};save(rec);
  var ladder=["A1","A2","B1","B2","C1","C2"].map(function(l){var on=(lvl===l)||(lvl==="C1+"&&l==="C1");return '<span class="'+(on?'on':'')+'">'+l+'</span>'}).join("");
  var sk=Object.keys(S.sk).map(function(k){var v=S.sk[k];return '<div><b>'+v[0]+'/'+v[1]+'</b><span>'+KIND[k]+'</span></div>'}).join("");
  var h='<div class="card res"><span class="kind">Your estimated level</span><div><span class="big lv">'+(lvl==="Pre-A1"?"A0":lvl)+'</span></div>'+
   '<h2>'+esc(inf.n)+'</h2><p class="d">'+inf.d+'</p><div class="ladder">'+ladder+'</div>'+
   '<div class="skills">'+sk+'</div>'+
   '<div class="card box"><h3>✅ What you can do now</h3><ul>'+inf.can.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div>'+
   '<div class="card box"><h3>🎯 Your next steps</h3><ul>'+inf.next.map(function(x){return '<li>'+x+'</li>'}).join("")+
   '<li>Follow the free 12-week plan for your level</li></ul></div>'+
   '<div class="note" style="text-align:left">📅 Practise every day and take the test again after 4 weeks to see your own progress.<br>ℹ️ This is an estimate, not an official certificate. Speaking and writing are not measured here.</div>'+
   '<div id="cloudbox"></div><div class="ctas"><a class="btn pri" href="path.html">Start my 12-week plan →</a><button class="btn" id="again">Take the test again</button><button class="btn" id="share">🔗 Share</button></div></div>';
  out.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("again").onclick=start;
  if(window.acLevelResult)window.acLevelResult(rec);else window.acPending=rec;
  document.getElementById("share").onclick=function(){var t="My English level is "+(lvl==="Pre-A1"?"A0":lvl)+"! Take the free test too:",u="https://accent-coach.devmamun.com/level-test.html";
    if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});
    else{try{navigator.clipboard.writeText(t+" "+u);this.textContent="✓ Link copied"}catch(e){}}};
}

window.acIntro=function(){if(document.getElementById("go"))intro()};
intro();
})();
</script>
<script type="module">
import * as C from "./cloud.js?v=15";
let user=null,pending=window.acPending||null,state="";
const box=()=>{const el=document.getElementById("cloudbox");if(!el||!pending)return;
  if(state==="ok")el.innerHTML='<div class="cloud ok">☁️ Your result is saved to your account. You can see it on any device.</div>';
  else if(state==="saving")el.innerHTML='<div class="cloud">☁️ Saving…</div>';
  else if(state==="err")el.innerHTML='<div class="cloud">⚠️ Couldn\'t save online (your result is saved on this device). <button class="btn" id="cs">Try again</button></div>';
  else if(!user)el.innerHTML='<div class="cloud">☁️ Want to keep this result in your account? <button class="btn" id="cs">Sign in with Google</button></div>';
  const b=document.getElementById("cs");if(b)b.onclick=()=>{if(user)doSave();else C.signIn().catch(()=>{})};};
async function doSave(){if(!user||!pending)return;state="saving";box();
  try{await C.saveLevel(user,pending);state="ok"}catch(e){console.warn(e);state="err"}box();}
window.acLevelResult=r=>{pending=r;state="";if(user)doSave();else box();};
if(C.enabled)C.onUser(async u=>{if(u&&u.cached)return;user=u||null;
  if(user&&pending&&state!=="ok"){doSave();return}
